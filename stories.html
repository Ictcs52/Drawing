<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นิทาน Read Aloud | PUN&PIN</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Mali,'Noto Sans Thai',sans-serif;background:linear-gradient(180deg,#eef9ff,#fff9fd);color:#342b58}.wrap{max-width:980px;margin:auto;padding:16px 15px 60px}.top{display:flex;gap:12px;align-items:center;background:#fff;padding:12px 15px;border-radius:22px;box-shadow:0 10px 30px #503b7618;position:sticky;top:8px;z-index:5}.back{border:0;width:45px;height:45px;border-radius:14px;background:#f1edff;font-size:21px;cursor:pointer}.top h1{margin:0;font-size:clamp(20px,4vw,29px)}.top p{margin:2px 0;color:#81799a;font:13px 'Noto Sans Thai'}.hero{margin:19px 0;padding:25px;border-radius:30px;background:linear-gradient(135deg,#5cc8f5,#8467ea 58%,#ff72a7);color:#fff}.hero h2{margin:0;font-size:clamp(28px,5vw,43px)}.library{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.book{border:3px solid #fff;border-radius:25px;padding:18px;background:#fff;box-shadow:0 13px 30px #3f2d7017;cursor:pointer;text-align:left}.cover{height:125px;border-radius:20px;display:grid;place-items:center;font-size:65px;background:linear-gradient(145deg,#fff3b8,#ffe7f1 55%,#e7f8ff)}.book h3{margin:12px 0 4px}.book p{font:13px 'Noto Sans Thai';color:#7c7592;margin:0}.reader{display:none;background:#fff;border-radius:30px;padding:20px;box-shadow:0 18px 45px #3d2b711d}.reader.on{display:block}.scene{min-height:230px;border-radius:25px;display:grid;place-items:center;font-size:110px;background:linear-gradient(145deg,#fff6c9,#eaf8ff)}.en{font-size:clamp(24px,5vw,38px);font-weight:700;text-align:center;margin:18px 0 7px}.read,.th{text-align:center;font-family:'Noto Sans Thai';margin:4px}.read{color:#745fc9}.th{color:#716b84}.controls{display:flex;justify-content:center;gap:9px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:12px 18px;background:#f0ecff;color:#483a77;font-family:Mali;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#765de0,#ff659e);color:#fff}.progress{text-align:center;color:#847c99;margin-top:10px;font-size:13px}@media(max-width:720px){.library{grid-template-columns:1fr 1fr}}@media(max-width:440px){.library{grid-template-columns:1fr}.cover{height:100px}.scene{min-height:185px;font-size:85px}}</style></head><body><div class="wrap"><header class="top"><button class="back" onclick="location.href='./'">←</button><div><h1>📚 นิทาน Read Aloud</h1><p>อ่าน ฟัง และเรียนภาษาอังกฤษจากเรื่องสั้น</p></div></header><section class="hero"><h2>Story Time! 🌈</h2><p>เลือกนิทาน แล้วแตะ 🔊 เพื่อฟังภาษาอังกฤษทีละหน้า</p></section><main id="library" class="library"></main><section id="reader" class="reader"><div id="scene" class="scene"></div><div id="en" class="en"></div><div id="read" class="read"></div><div id="th" class="th"></div><div class="controls"><button class="btn" id="prev">← ก่อนหน้า</button><button class="btn primary" id="speak">🔊 ฟังประโยค</button><button class="btn" id="next">ถัดไป →</button><button class="btn" id="close">📚 เลือกเรื่อง</button></div><div id="prog" class="progress"></div></section></div><script>const B=[{t:'The Little Cat',c:'🐱',d:'แมวน้อยออกไปสำรวจสวน',p:[['🐱','I see a cat.','ไอ ซี อะ แคท','ฉันเห็นแมว'],['🌸','The cat sees a flower.','เดอะ แคท ซีซ อะ ฟลาว-เออร์','แมวเห็นดอกไม้'],['🦋','A butterfly flies by.','อะ บัท-เทอร์-ฟลาย ฟลายส์ บาย','ผีเสื้อบินผ่านไป'],['🏠','The cat goes home.','เดอะ แคท โกซ โฮม','แมวกลับบ้าน']]},{t:'My Red Ball',c:'⚽',d:'ลูกบอลสีแดงของฉัน',p:[['🔴','I have a red ball.','ไอ แฮฟ อะ เรด บอล','ฉันมีลูกบอลสีแดง'],['🏃','I run with my ball.','ไอ รัน วิธ มาย บอล','ฉันวิ่งไปกับลูกบอล'],['👧','My friend plays with me.','มาย เฟรนด์ เพลย์ส วิธ มี','เพื่อนเล่นกับฉัน'],['😊','We are happy.','วี อาร์ แฮป-พี','พวกเรามีความสุข']]},{t:'Good Morning!',c:'🌞',d:'กิจวัตรยามเช้า',p:[['⏰','I wake up in the morning.','ไอ เวค อัพ อิน เดอะ มอร์-นิง','ฉันตื่นนอนตอนเช้า'],['🪥','I brush my teeth.','ไอ บรัช มาย ทีธ','ฉันแปรงฟัน'],['🍳','I eat breakfast.','ไอ อีต เบรก-ฟาสท์','ฉันกินอาหารเช้า'],['🏫','I go to school.','ไอ โก ทู สคูล','ฉันไปโรงเรียน']]},{t:'At the Zoo',c:'🦁',d:'เรียนรู้สัตว์ในสวนสัตว์',p:[['🦁','I see a big lion.','ไอ ซี อะ บิก ไล-อัน','ฉันเห็นสิงโตตัวใหญ่'],['🐘','The elephant is strong.','ดิ เอ-ละ-เฟินท์ อิส สตรอง','ช้างแข็งแรง'],['🐒','The monkey can jump.','เดอะ มัง-คี แคน จัมพ์','ลิงกระโดดได้'],['🦒','The giraffe is tall.','เดอะ จิ-แรฟ อิส ทอล','ยีราฟตัวสูง']]},{t:'Rainy Day',c:'🌧️',d:'วันฝนตกแสนสนุก',p:[['☁️','The sky is cloudy.','เดอะ สกาย อิส คลาว-ดี','ท้องฟ้ามีเมฆมาก'],['🌧️','It is raining.','อิท อิส เรน-นิง','ฝนกำลังตก'],['☂️','I have an umbrella.','ไอ แฮฟ แอน อัม-เบรล-ละ','ฉันมีร่ม'],['🌈','I see a rainbow.','ไอ ซี อะ เรน-โบ','ฉันเห็นสายรุ้ง']]},{t:'Be Kind',c:'💖',d:'นิทานเรื่องความมีน้ำใจ',p:[['🧸','My friend has a toy.','มาย เฟรนด์ แฮซ อะ ทอย','เพื่อนของฉันมีของเล่น'],['🤲','We share our toys.','วี แชร์ อาวร์ ทอยส์','เราแบ่งปันของเล่น'],['🙏','I say thank you.','ไอ เซย์ แธงก์ ยู','ฉันพูดขอบคุณ'],['💖','Kind friends are happy.','ไคนด์ เฟรนด์ส อาร์ แฮป-พี','เพื่อนที่มีน้ำใจมีความสุข']]}];let bi=0,pi=0;const L=document.getElementById('library'),R=document.getElementById('reader');function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.7;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}function show(){const x=B[bi].p[pi];scene.textContent=x[0];en.textContent=x[1];read.textContent='คำอ่าน: '+x[2];th.textContent='แปล: '+x[3];prog.textContent=B[bi].t+' • หน้า '+(pi+1)+' / '+B[bi].p.length}L.innerHTML=B.map((b,i)=>`<button class="book" data-i="${i}"><div class="cover">${b.c}</div><h3>${b.t}</h3><p>${b.d}</p></button>`).join('');L.onclick=e=>{const b=e.target.closest('.book');if(!b)return;bi=+b.dataset.i;pi=0;L.style.display='none';R.classList.add('on');show()};speak.onclick=()=>speak(en.textContent);prev.onclick=()=>{pi=Math.max(0,pi-1);show()};next.onclick=()=>{pi=Math.min(B[bi].p.length-1,pi+1);show()};close.onclick=()=>{R.classList.remove('on');L.style.display='grid'};</script></body></html>
