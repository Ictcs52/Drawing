<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#53caa1"><title>My World | PUN&PIN</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:Mali,'Noto Sans Thai',sans-serif;color:#3d3a59;background:linear-gradient(180deg,#c8f1ff,#f8fff1 55%,#fff4d6)}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px 14px 45px}.top{display:flex;align-items:center;gap:10px;padding:10px 12px;border:3px solid #fff;border-radius:22px;background:#ffffffdf;box-shadow:0 8px 0 #dbe7dc}.back{width:44px;height:44px;border:0;border-radius:14px;background:#ecf8f2;font-size:20px}.top h1{margin:0;font-size:1.4rem}.top p{margin:2px 0 0;font:12px 'Noto Sans Thai';color:#74777e}.grade{margin-left:auto;padding:8px 10px;border-radius:999px;background:#fff0b3;font-size:.72rem;font-weight:700}.hero{margin:14px 0;padding:18px;border:4px solid #fff;border-radius:28px;background:linear-gradient(135deg,#54cfa7,#53bfea 60%,#8d71e8);color:#fff;box-shadow:0 9px 0 #d7dfdf}.hero h2{margin:0;font-size:clamp(1.5rem,5vw,2.2rem)}.hero p{margin:5px 0 0;font:13px 'Noto Sans Thai';opacity:.9}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{border:3px solid #fff;border-radius:20px;padding:12px;background:#fff;font-weight:700;color:#55506f;box-shadow:0 6px 0 #dce1df;cursor:pointer}.tab.on{color:#fff;background:linear-gradient(135deg,#53c99d,#4fb4e6);box-shadow:0 6px 0 #359677}.card{padding:18px;border:4px solid #fff;border-radius:28px;background:#fff;box-shadow:0 9px 0 #dfe4df,0 18px 35px #405d4d18}.visual{min-height:100px;display:grid;place-items:center;font-size:clamp(3rem,12vw,6rem);border-radius:24px;background:linear-gradient(145deg,#ecfbff,#fff7d6)}h3{text-align:center;font-size:1.35rem;margin:15px 0 12px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ans{min-height:70px;border:3px solid #fff;border-radius:19px;padding:10px;background:#f2f8f5;color:#45435a;font-weight:700;box-shadow:0 5px 0 #dae4dd;cursor:pointer}.ans.good{background:#d9ffe8;color:#246e4c}.ans.bad{background:#ffe0e8;color:#a44162}.feedback{text-align:center;min-height:30px;margin-top:12px;font-weight:700}.next{display:none;width:100%;margin-top:9px;border:0;border-radius:18px;padding:12px;background:#59c99e;color:#fff;font-weight:700;box-shadow:0 5px 0 #389875}.next.show{display:block}.meter{height:12px;border-radius:99px;background:#eef1ef;margin:0 0 15px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#58c99f,#56bcec,#8a70e4)}.finish{display:none;text-align:center}.finish.on{display:block}.finish .big{font-size:72px}.finish button{border:0;border-radius:18px;padding:12px 16px;background:#725fda;color:#fff;font-weight:700}@media(max-width:600px){.answers{grid-template-columns:1fr}.card{padding:14px}}</style><link rel="stylesheet" href="kids-cute-ui.css?v=1">
</head><body><div class="wrap"><header class="top"><button class="back" onclick="location.href='index.html'">←</button><div><h1>🌍 My World</h1><p>วิทยาศาสตร์รอบตัว + ทักษะชีวิต</p></div><span class="grade" id="gradeLabel"></span></header><section class="hero"><h2>เรียนรู้โลกและดูแลตัวเอง 🌱</h2><p>สังเกต คิด เลือกสิ่งที่ปลอดภัย และเข้าใจความรู้สึกของตนเอง</p></section><div class="tabs"><button class="tab on" data-mode="science">🔬 Science & World</button><button class="tab" data-mode="life">😊 Life & Feelings</button></div><main class="card" id="game"><div class="meter"><i id="meter"></i></div><div class="visual" id="visual"></div><h3 id="question"></h3><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">ข้อต่อไป ›</button></main><section class="card finish" id="finish"><div class="big">🌟</div><h2>เก่งมาก!</h2><p>เรียนรู้ครบชุดแล้ว</p><button onclick="restart()">เล่นอีกชุด</button></section></div><script>const grade=localStorage.getItem('punpin_grade_v1')||'k',names={k:'อนุบาล',p1:'ป.1',p2:'ป.2',p3:'ป.3'};document.getElementById('gradeLabel').textContent=names[grade];const D={science:{k:[['🌱','ต้นไม้ต้องการอะไรเพื่อเติบโต?','น้ำและแสง',['น้ำและแสง','ของเล่น','รองเท้า','ขนม']],['🐟','สัตว์ชนิดใดอยู่ในน้ำ?','ปลา',['ปลา','แมว','ไก่','ม้า']],['☀️🌙','สิ่งใดเห็นได้ในตอนกลางวัน?','ดวงอาทิตย์',['ดวงอาทิตย์','ดวงจันทร์เท่านั้น','ดาวเต็มฟ้า','ไม่มีอะไร']],['👃','อวัยวะใดใช้ดมกลิ่น?','จมูก',['จมูก','หู','มือ','เท้า']]],p1:[['🦋','ผีเสื้อเป็นสิ่งมีชีวิตหรือไม่?','เป็น',['เป็น','ไม่เป็น','เป็นของเล่น','เป็นพืช']],['🌧️','เมฆมืดและฝนตกคือสภาพอากาศแบบใด?','ฝนตก',['ฝนตก','แดดจัด','หิมะ','แห้งแล้ง']],['🧊☀️','น้ำแข็งโดนความร้อนจะเกิดอะไร?','ละลาย',['ละลาย','แข็งขึ้น','หายเป็นหิน','เพิ่มจำนวน']],['🌱','ส่วนใดของพืชดูดน้ำจากดิน?','ราก',['ราก','ดอก','ผล','ใบเท่านั้น']]],p2:[['🐸🥚','ลูกอ๊อดโตขึ้นเป็นอะไร?','กบ',['กบ','ปลา','นก','แมว']],['💧🔥','เมื่อน้ำได้รับความร้อนมากจะเกิดอะไร?','กลายเป็นไอน้ำ',['กลายเป็นไอน้ำ','กลายเป็นหิน','กลายเป็นน้ำแข็ง','ไม่มีการเปลี่ยนแปลง']],['🧲📎','แม่เหล็กดูดสิ่งใดได้ดี?','คลิปเหล็ก',['คลิปเหล็ก','ยางลบ','กระดาษ','ไม้']],['🌞🌱','พืชใช้แสงเพื่อช่วยทำอะไร?','สร้างอาหาร',['สร้างอาหาร','เดิน','นอน','ส่งเสียง']]],p3:[['🌎☀️','โลกโคจรรอบอะไร?','ดวงอาทิตย์',['ดวงอาทิตย์','ดวงจันทร์','ดาวอังคาร','เมฆ']],['🧲','ขั้วแม่เหล็กเหมือนกันจะเป็นอย่างไร?','ผลักกัน',['ผลักกัน','ดูดกันเสมอ','ละลาย','หายไป']],['💧☁️🌧️','การระเหย ควบแน่น และฝน เป็นส่วนของอะไร?','วัฏจักรน้ำ',['วัฏจักรน้ำ','ห่วงโซ่อาหาร','วงจรไฟฟ้า','การหายใจ']],['🌿🐛🐦','พืช → หนอน → นก แสดงถึงอะไร?','ห่วงโซ่อาหาร',['ห่วงโซ่อาหาร','วงจรน้ำ','การคูณ','การสะท้อนแสง']]]},life:{k:[['🧼👐','ก่อนกินข้าวควรทำอะไร?','ล้างมือ',['ล้างมือ','วิ่งเล่น','นอน','ซ่อนอาหาร']],['😢','ถ้าเพื่อนร้องไห้ เราควรทำอย่างไร?','ปลอบเพื่อน',['ปลอบเพื่อน','หัวเราะ','แกล้งต่อ','เดินหนีเสมอ']],['🚦','ก่อนข้ามถนนควรทำอะไร?','มองซ้ายขวาและข้ามทางปลอดภัย',['มองซ้ายขวาและข้ามทางปลอดภัย','วิ่งทันที','หลับตา','เล่นโทรศัพท์']],['🪥','อะไรช่วยดูแลฟัน?','แปรงฟัน',['แปรงฟัน','กินลูกอมทั้งวัน','ไม่ต้องทำอะไร','นอนทันที']]],p1:[['😡','เมื่อโกรธ ควรทำอะไรก่อน?','หยุดและหายใจช้า ๆ',['หยุดและหายใจช้า ๆ','ตีเพื่อน','ขว้างของ','ตะโกนใส่ทุกคน']],['🔥','ถ้าเห็นไฟไหม้ ควรทำอย่างไร?','บอกผู้ใหญ่และออกจากพื้นที่',['บอกผู้ใหญ่และออกจากพื้นที่','เข้าไปจับไฟ','ซ่อนตัว','เล่นใกล้ ๆ']],['🎒','หลังใช้ของเสร็จควรทำอะไร?','เก็บเข้าที่',['เก็บเข้าที่','ทิ้งไว้พื้น','ซ่อนของ','โยนทิ้ง']],['🤝','ถ้าเพื่อนขอยืมสีและเราสะดวก ควรทำอย่างไร?','แบ่งปัน',['แบ่งปัน','แย่งของเพื่อน','ทำลายสี','ไม่พูดอะไรเลย']]],p2:[['🔌💧','มือเปียกควรจับปลั๊กไฟหรือไม่?','ไม่ควร',['ไม่ควร','ควร','จับได้เสมอ','เฉพาะตอนรีบ']],['😟','ถ้ากังวลเรื่องเรียน ควรทำอย่างไร?','คุยกับผู้ใหญ่ที่ไว้ใจ',['คุยกับผู้ใหญ่ที่ไว้ใจ','เก็บไว้คนเดียวเสมอ','แกล้งเพื่อน','หนีออกจากบ้าน']],['💰','มีเงินค่าขนมจำกัด ควรทำอย่างไร?','วางแผนใช้เงิน',['วางแผนใช้เงิน','ใช้หมดทันที','ซื้อทุกอย่าง','ยืมตลอดเวลา']],['🕘📚','การทำการบ้านตามเวลาช่วยเรื่องอะไร?','ความรับผิดชอบ',['ความรับผิดชอบ','ทำให้ลืมงาน','ทำให้สาย','ไม่มีประโยชน์']]],p3:[['🌐','ข้อมูลส่วนตัว เช่น รหัสผ่าน ควรบอกคนแปลกหน้าหรือไม่?','ไม่ควร',['ไม่ควร','ควรเสมอ','บอกทุกคน','โพสต์สาธารณะ']],['💬','ถ้ามีความเห็นต่างกับเพื่อน ควรทำอย่างไร?','พูดคุยอย่างสุภาพ',['พูดคุยอย่างสุภาพ','ด่ากัน','เลิกคบทันที','โพสต์ประจาน']],['🚲⛑️','ขี่จักรยานควรสวมอะไร?','หมวกนิรภัย',['หมวกนิรภัย','ผ้าพันคออย่างเดียว','รองเท้าแตะอย่างเดียว','ไม่ต้องสวมอะไร']],['📅','การแบ่งเวลาเรียน เล่น และพัก ช่วยเรื่องอะไร?','จัดการตนเอง',['จัดการตนเอง','ทำให้เหนื่อยเสมอ','ทำให้ลืมงาน','ไม่มีผล']]]}};let mode='science',i=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){locked=false;$('finish').classList.remove('on');$('game').style.display='block';const set=D[mode][grade],q=set[i%set.length];$('meter').style.width=((i)/set.length*100)+'%';$('visual').textContent=q[0];$('question').textContent=q[1];$('feedback').textContent='';$('next').classList.remove('show');$('answers').innerHTML='';shuffle(q[3]).forEach(x=>{const b=document.createElement('button');b.className='ans';b.textContent=x;b.onclick=()=>answer(b,x,q[2]);$('answers').appendChild(b)})}function answer(b,v,a){if(locked)return;if(v===a){locked=true;b.classList.add('good');$('feedback').textContent='ถูกต้อง เก่งมาก! ⭐';[...$('answers').children].forEach(x=>x.disabled=true);$('next').classList.add('show')}else{b.classList.add('bad');$('feedback').textContent='ลองคิดอีกครั้งนะ';setTimeout(()=>b.classList.remove('bad'),400)}}$('next').onclick=()=>{i++;if(i>=D[mode][grade].length){$('meter').style.width='100%';$('game').style.display='none';$('finish').classList.add('on')}else render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;i=0;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});function restart(){i=0;render()}window.restart=restart;render();</script><script src="kids-sfx.js?v=1"></script>
</body></html>
