<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listen & Repeat | PUN&PIN</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Mali,'Noto Sans Thai',sans-serif;background:linear-gradient(180deg,#fff7fc,#edf9ff);color:#342b58}.wrap{max-width:900px;margin:auto;padding:16px 15px 60px}.top{display:flex;gap:12px;align-items:center;background:#fff;padding:12px 15px;border-radius:22px;box-shadow:0 10px 30px #503b7618}.back{border:0;width:45px;height:45px;border-radius:14px;background:#f1edff;font-size:21px}.hero{margin:19px 0;padding:24px;border-radius:30px;background:linear-gradient(135deg,#ff73a7,#8365ea 58%,#4bc7ed);color:#fff}.hero h2{margin:0;font-size:clamp(28px,5vw,42px)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:0;border-radius:999px;padding:10px 14px;background:#fff;font-family:Mali;white-space:nowrap}.tab.on{background:#342b58;color:#fff}.card{background:#fff;border:3px solid #fff;border-radius:30px;padding:24px;box-shadow:0 17px 40px #3a2a6a1a;text-align:center}.emoji{font-size:88px}.en{font-size:clamp(28px,6vw,46px);font-weight:700;margin:10px 0}.read{font-family:'Noto Sans Thai';color:#725fc4}.th{font-family:'Noto Sans Thai';color:#77708b;margin-top:5px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:18px;padding:13px 19px;background:#f0edff;color:#493c76;font-family:Mali;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#765ce0,#ff659e);color:#fff}.status{min-height:28px;color:#736a8d;font-family:'Noto Sans Thai'}.nav{display:flex;justify-content:space-between;margin-top:15px}.note{margin-top:15px;padding:12px 14px;border-radius:18px;background:#fff7d7;font:13px 'Noto Sans Thai';color:#6f684f}</style></head><body><div class="wrap"><header class="top"><button class="back" onclick="location.href='./'">←</button><div><h1 style="margin:0;font-size:clamp(20px,4vw,29px)">🎤 Listen & Repeat</h1><p style="margin:2px 0;color:#81799a;font:13px 'Noto Sans Thai'">ฟังภาษาอังกฤษ แล้วลองพูดตาม</p></div></header><section class="hero"><h2>Speak English! 🌈</h2><p>เหมาะสำหรับเด็กอนุบาลถึง ป.3 เริ่มจากประโยคสั้น ๆ ก่อน</p></section><div class="tabs" id="tabs"></div><section class="card"><div id="emoji" class="emoji"></div><div id="en" class="en"></div><div id="read" class="read"></div><div id="th" class="th"></div><div class="controls"><button id="listen" class="btn primary">🔊 ฟัง</button><button id="repeat" class="btn">🎤 ฉันพูดแล้ว</button></div><div id="status" class="status"></div><div class="nav"><button id="prev" class="btn">← ก่อนหน้า</button><button id="next" class="btn">ถัดไป →</button></div><div class="note">หมายเหตุ: เวอร์ชันนี้เน้น Listen & Repeat เพื่อสร้างความมั่นใจก่อน ยังไม่ให้คะแนนการออกเสียงแบบเข้มงวดกับเด็ก</div></section></div><script>const G={greet:'ทักทาย',class:'ห้องเรียน',daily:'ชีวิตประจำวัน',feel:'ความรู้สึก',question:'ถาม–ตอบ'};const S={greet:[['👋','Hello!','เฮล-โล','สวัสดี'],['🌅','Good morning.','กูด มอร์-นิง','สวัสดีตอนเช้า'],['🙂','How are you?','ฮาว อาร์ ยู','สบายดีไหม'],['😊','I am fine.','ไอ แอม ไฟน์','ฉันสบายดี'],['👋','See you.','ซี ยู','แล้วพบกัน']],class:[['🪑','Sit down, please.','ซิท ดาวน์ พลีซ','กรุณานั่งลง'],['🧍','Stand up, please.','สแตนด์ อัพ พลีซ','กรุณายืนขึ้น'],['👂','Listen to me.','ลิส-เซิน ทู มี','ฟังฉันนะ'],['📖','Open your book.','โอ-เพิน ยัวร์ บุ๊ก','เปิดหนังสือ'],['✋','Raise your hand.','เรซ ยัวร์ แฮนด์','ยกมือขึ้น']],daily:[['🪥','I brush my teeth.','ไอ บรัช มาย ทีธ','ฉันแปรงฟัน'],['🍳','I eat breakfast.','ไอ อีต เบรก-ฟาสท์','ฉันกินอาหารเช้า'],['🏫','I go to school.','ไอ โก ทู สคูล','ฉันไปโรงเรียน'],['🧸','I want to play.','ไอ วอนท์ ทู เพลย์','ฉันอยากเล่น'],['🛏️','I go to bed.','ไอ โก ทู เบด','ฉันเข้านอน']],feel:[['😊','I am happy.','ไอ แอม แฮป-พี','ฉันมีความสุข'],['😢','I am sad.','ไอ แอม แซด','ฉันเศร้า'],['😴','I am tired.','ไอ แอม ไทเอิร์ด','ฉันเหนื่อย'],['😋','I am hungry.','ไอ แอม ฮัง-กรี','ฉันหิว'],['👍','I like it.','ไอ ไลก์ อิท','ฉันชอบมัน']],question:[['❓','What is this?','วอท อิส ดิส','นี่คืออะไร'],['🎨','What color is it?','วอท คัล-เลอร์ อิส อิท','มันสีอะไร'],['🔢','How many?','ฮาว เมน-นี','มีกี่อัน'],['🍎','Do you like apples?','ดู ยู ไลก์ แอป-เพิลส์','หนูชอบแอปเปิลไหม'],['⭐','Yes, I can.','เยส ไอ แคน','ใช่ ฉันทำได้']]};let c='greet',i=0;const $=x=>document.getElementById(x);function speak(t){if(!('speechSynthesis'in window)){status.textContent='อุปกรณ์นี้ไม่รองรับเสียงพูด';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.68;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}function render(){const x=S[c][i];emoji.textContent=x[0];en.textContent=x[1];read.textContent='คำอ่าน: '+x[2];th.textContent='แปล: '+x[3];status.textContent='';[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c))}tabs.innerHTML=Object.entries(G).map(([k,v])=>`<button class="tab" data-c="${k}">${v}</button>`).join('');tabs.onclick=e=>{if(e.target.dataset.c){c=e.target.dataset.c;i=0;render()}};listen.onclick=()=>speak(en.textContent);repeat.onclick=()=>{status.textContent='🌟 เก่งมาก! ลองพูดอีกครั้งให้ชัดขึ้นนะ';try{const k='punpin_speaking_count';localStorage.setItem(k,(+localStorage.getItem(k)||0)+1)}catch(e){}};prev.onclick=()=>{i=(i-1+S[c].length)%S[c].length;render()};next.onclick=()=>{i=(i+1)%S[c].length;render()};render();</script><script src="kids-sfx.js?v=1"></script>
</body></html>
