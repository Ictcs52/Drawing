name: Unify kindergarten vocabulary
on:
  push:
    branches: [main]
    paths: ['vocabulary-kindergarten.js']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocabulary.html'); s=p.read_text()
          tag='<script src="vocabulary-kindergarten.js"></script>'
          if tag not in s: s=s.replace('</body>',tag+'</body>')
          s=s.replace('สำหรับอนุบาล 1–3 •','สำหรับเด็กอนุบาล •')
          # Hide old K1/K2/K3 selector and show one kindergarten label.
          s=s.replace("$('#levels').innerHTML=[[0,'ทั้งหมด'],[1,'อนุบาล 1'],[2,'อนุบาล 2'],[3,'อนุบาล 3']]", "$('#levels').innerHTML=[[0,'🌈 อนุบาล']]")
          p.write_text(s)
          # Sentences page wording too.
          q=Path('sentences.html')
          if q.exists():
              t=q.read_text().replace('อนุบาล 1–3 •','เด็กอนุบาล •')
              q.write_text(t)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vocabulary.html sentences.html
          git diff --cached --quiet && exit 0
          git commit -m "Combine K1-K3 into one kindergarten vocabulary collection"
          git push
