name: Apply kindergarten vocabulary stages
on:
  push:
    paths:
      - '.github/workflows/apply-kindergarten-vocab-stages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add kindergarten staged vocabulary script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocabulary.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="vocabulary-kindergarten-stages.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary.html
          git commit -m "Enable three-stage kindergarten vocabulary curriculum"
          git push