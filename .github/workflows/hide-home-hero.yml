name: Hide home hero before paint
on:
  push:
    paths:
      - '.github/workflows/hide-home-hero.yml'
permissions:
  contents: write
jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide hero in source HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="hero">'
          new='<div class="hero" hidden aria-hidden="true">'
          if new not in s:
              if old not in s:
                  raise SystemExit('home hero markup not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit source change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide home hero before first paint"
          git push
