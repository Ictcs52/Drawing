name: Route all grades to vocabulary curriculum
on:
  push:
    paths:
      - '.github/workflows/route-all-grades-vocabulary.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use grade vocabulary page for all grades
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('grade-mode.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("english:['Vocabulary · ประโยคสั้น · อ่านเข้าใจ','learning-today.html?subject=english']","english:['Vocabulary · ประโยคสั้น · อ่านเข้าใจ','vocabulary.html']")
          s=s.replace("english:['Reading · Sentence · Grammar เบื้องต้น','learning-today.html?subject=english']","english:['Reading · Sentence · Grammar เบื้องต้น','vocabulary.html']")
          s=s.replace("if(missionButtons[0])missionButtons[0].onclick=()=>location.href=(g==='p2'||g==='p3')?'learning-today.html?subject=english':'vocabulary.html';","if(missionButtons[0])missionButtons[0].onclick=()=>location.href='vocabulary.html';")
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8').replace('grade-mode.js?v=2','grade-mode.js?v=3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grade-mode.js index.html
          git commit -m "Open grade-specific vocabulary for all English levels"
          git push
