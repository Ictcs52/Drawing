name: Wire vocabulary activity
on:
  push:
    branches: [main]
    paths:
      - 'home-vocabulary.js'
      - '.github/workflows/wire-vocabulary.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add vocabulary script to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="home-vocabulary.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show vocabulary activity on home"
          git push