name: Apply UI polish link

on:
  push:
    branches: [main]
    paths:
      - ui-polish.css
      - .github/workflows/apply-ui-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stylesheet link once
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="ui-polish.css?v=1">'
          if marker not in s:
              s = s.replace('</head>', f'{marker}\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit generated link
        run: |
          if git diff --quiet -- index.html; then
            echo "Stylesheet link already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load visual polish stylesheet"
          git push
