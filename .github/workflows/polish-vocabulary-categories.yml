name: Polish vocabulary category layout
on:
  push:
    paths:
      - '.github/workflows/polish-vocabulary-categories.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put heading before category cards and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocabulary-grade.js')
          s=p.read_text(encoding='utf-8')
          old="const intro=document.querySelector('.vGradeIntro');if(intro)intro.insertAdjacentElement('afterend',categoryWrap);else document.querySelector('.sectionTitle')?.insertAdjacentElement('beforebegin',categoryWrap);"
          new="const sectionTitle=document.querySelector('.sectionTitle');if(sectionTitle)sectionTitle.insertAdjacentElement('afterend',categoryWrap);else document.querySelector('.vGradeIntro')?.insertAdjacentElement('afterend',categoryWrap);"
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          p=Path('vocabulary.html')
          s=p.read_text(encoding='utf-8').replace('vocabulary-grade.js?v=2','vocabulary-grade.js?v=3')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary-grade.js vocabulary.html
          git commit -m "Polish grade vocabulary category layout"
          git push
