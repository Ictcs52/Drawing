name: Wire math through Grade 3
on:
  push:
    branches: [main]
    paths: ['math-k3.js']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          tag='<script src="math-k3.js"></script>'
          if tag not in s: s=s.replace('</body>',tag+'</body>')
          s=s.replace('นับ บวก และลบ สำหรับอนุบาล 1–3','บวก–ลบ สำหรับอนุบาลถึง ป.3')
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add math levels from kindergarten through Grade 3"
          git push
