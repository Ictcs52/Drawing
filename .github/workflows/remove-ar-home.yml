name: Remove AR Hand Play from home
on:
  push:
    paths:
      - '.github/workflows/remove-ar-home.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove AR card and bump home cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('kids-world-v2.js')
          s=p.read_text(encoding='utf-8')
          ar='<button class="kwZone arFeature" data-url="ar-hand.html"><span>👌</span><b>AR Hand Play</b><small>ใช้มือหยิบ · ลาก · จับคู่</small><i>AR</i></button>'
          s=s.replace(ar,'')
          p.write_text(s,encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'kids-world-v2\.js\?v=\d+','kids-world-v2.js?v=11',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kids-world-v2.js index.html
          git commit -m "Remove AR Hand Play from home"
          git push
# trigger: 2