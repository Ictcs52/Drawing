name: Wire kids sound effects
on:
  push:
    paths:
      - 'kids-sfx.js'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sound script to HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag='<script src="kids-sfx.js?v=1"></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'kids-sfx.js' in s or '</body>' not in s:
                  continue
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
              changed.append(p.name)
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Enable playful sound effects across games"
          git push