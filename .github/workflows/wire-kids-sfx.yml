name: Wire kids sound effects
on:
  push:
    paths:
      - 'kids-sfx.js'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add or refresh sound and feedback script on HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          tag='<script src="kids-sfx.js?v=2"></script>'
          changed=[]
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              if 'kids-sfx.js' in s:
                  s=re.sub(r'<script\s+src=["\']kids-sfx\.js(?:\?v=\d+)?["\']></script>',tag,s)
              elif '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>')
              if s!=old:
                  p.write_text(s,encoding='utf-8')
                  changed.append(p.name)
          print('updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Refresh playful feedback across games"
          git push