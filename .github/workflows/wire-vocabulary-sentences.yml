name: Wire vocabulary sentences
on:
  push:
    branches: [main]
    paths: ['vocabulary-nav.js']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vocabulary.html'); s=p.read_text()
          tag='<script src="vocabulary-nav.js"></script>'
          if tag not in s: s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vocabulary.html
          git diff --cached --quiet && exit 0
          git commit -m "Link short English sentences from vocabulary"
          git push
