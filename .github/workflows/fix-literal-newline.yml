name: Fix literal newline text
on:
  push:
    paths:
      - '.github/workflows/fix-literal-newline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visible literal newline token
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</script>\\n<script src="kids-sfx.js?v=2"></script>', '</script>\n<script src="kids-sfx.js?v=2"></script>')
          s=s.replace('</script>\\n<script', '</script>\n<script')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove visible literal newline from page"
          git push
