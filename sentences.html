<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประโยคภาษาอังกฤษ | PUN&PIN</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:Mali,'Noto Sans Thai',sans-serif;background:linear-gradient(180deg,#fff9fd,#f1f8ff);color:#342b58}.wrap{max-width:1050px;margin:auto;padding:16px 15px 60px}.top{display:flex;gap:12px;align-items:center;background:#fff;padding:12px 15px;border-radius:22px;box-shadow:0 10px 30px #503b7618;position:sticky;top:8px;z-index:5}.back{border:0;width:45px;height:45px;border-radius:14px;background:#f1edff;font-size:21px}.top h1{margin:0;font-size:clamp(20px,4vw,29px)}.top p{margin:2px 0;color:#81799a;font:13px 'Noto Sans Thai'}.hero{margin:19px 0;padding:25px;border-radius:30px;background:linear-gradient(135deg,#ff75a8,#8a6bea 58%,#5bbff4);color:#fff;display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0 0 5px;font-size:clamp(26px,5vw,42px)}.hero p{margin:0;font-family:'Noto Sans Thai'}.hero b{font-size:75px}.filters{display:flex;gap:8px;overflow:auto;padding:2px 0 13px}.pill{white-space:nowrap;border:0;border-radius:999px;background:#fff;padding:10px 14px;font-family:Mali;box-shadow:0 6px 18px #43336412}.pill.on{background:#342b58;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{border:0;background:#fff;text-align:left;border-radius:24px;padding:17px;box-shadow:0 10px 28px #47386c12;cursor:pointer;display:grid;grid-template-columns:58px 1fr 38px;gap:12px;align-items:center}.emoji{width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#fff0f6,#eaf7ff);display:grid;place-items:center;font-size:34px}.en{font-size:19px;font-weight:700}.read,.th{font:13px 'Noto Sans Thai';margin-top:3px}.read{color:#745fc9}.th{color:#77708e}.sound{font-size:22px;background:#f2efff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero b{font-size:55px}.card{padding:13px}.en{font-size:17px}}</style></head><body><div class="wrap"><header class="top"><button class="back" onclick="location.href='vocabulary.html'">←</button><div><h1>💬 ประโยคสั้น ๆ ภาษาอังกฤษ</h1><p>อนุบาล 1–3 • ฟัง พูดตาม และใช้ในชีวิตประจำวัน</p></div></header><section class="hero"><div><h2>Let’s speak! 🎤</h2><p>แตะประโยคเพื่อฟังเสียง แล้วลองพูดตาม 2 ครั้ง</p></div><b>🗣️</b></section><div class="filters" id="filters"></div><main class="grid" id="grid"></main></div><script>const C={all:'ทั้งหมด',greet:'ทักทาย',class:'ในห้องเรียน',self:'เกี่ยวกับตัวเอง',need:'ความต้องการ',daily:'ชีวิตประจำวัน',feel:'ความรู้สึก',question:'ถาม–ตอบ',manners:'คำสุภาพ'};const S=[
