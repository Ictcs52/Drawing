<!doctype html>
<html lang="th"><head>
<script src="thai-voice.js?v=20261009"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#286b59"><title>เล่นและค้นพบ | PUN&PIN</title><link rel="stylesheet" href="kids-cute-ui.css?v=20261007"><link rel="stylesheet" href="play-discover.css?v=1"></head>
<body data-feedback-manual><main class="discover"><header><a class="icon" href="index.html" aria-label="กลับหน้าหลัก">⌂</a><h1 id="title">เล่นและค้นพบ</h1><button class="icon" id="sound" aria-label="ปิดเสียง" aria-pressed="true">🔊</button><button class="icon" id="listen" aria-label="ฟังคำแนะนำซ้ำ">👂</button></header>
<nav aria-label="เลือกเกม"><button data-mode="listen">👂 ฟังแล้วเลือก</button><button data-mode="detective">🔎 นักสืบภาพ</button><button data-mode="coding">🐰 โค้ดดิ้งจิ๋ว</button></nav>
<div class="settings"><label for="difficulty">ระดับ</label><select id="difficulty"><option value="0">🌱 ง่าย</option><option value="1">🌼 กลาง</option><option value="2">🌟 ท้าทาย</option></select><span id="counter"></span></div>
<section id="game"><div class="prompt"><h2 id="question"></h2><p id="hint"></p></div><div id="board"></div><div id="codeTools" hidden><div class="arrows"><button data-dir="U" aria-label="เพิ่มลูกศรขึ้น">↑</button><button data-dir="L" aria-label="เพิ่มลูกศรซ้าย">←</button><button data-dir="D" aria-label="เพิ่มลูกศรลง">↓</button><button data-dir="R" aria-label="เพิ่มลูกศรขวา">→</button></div><div class="runTools"><button id="undo">↶ ย้อน</button><button id="clear">ล้าง</button><button id="run">▶ เดินเลย</button></div></div><div id="sequence" hidden aria-label="ลำดับคำสั่ง"></div><p id="feedback" role="status" aria-live="polite"></p><button id="next" hidden>ข้อต่อไป →</button></section>
<section id="finish" hidden><div class="trophy" aria-hidden="true">🏆</div><h2>เก่งมาก เล่นครบแล้ว!</h2><p id="summary"></p><button id="again">เล่นอีกครั้ง ↻</button><a href="index.html">กลับไปเลือกกิจกรรม</a></section>
</main><script src="kids-sfx.js?v=20261008popup"></script><script src="play-discover.js?v=20261008popup"></script><script src="all-category-cards.js?v=20261009all"></script>
